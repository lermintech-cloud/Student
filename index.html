    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Kodchasan:wght@400;500;600;700&family=Mali:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- ป้องกันปัญหาหน้าขาวบน GitHub Pages กรณีเปิด URL ที่ไม่มี Slash ปิดท้าย -->
    <script>
      (function() {
        var path = window.location.pathname;
        if (!path.endsWith('/') && !path.includes('.')) {
          window.location.replace(window.location.href + '/');
        }
      })();
    </script>
